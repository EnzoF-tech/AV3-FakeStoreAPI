<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Identificação</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-padding">
    <ion-card class="profile-card">
      <div class="photo-wrapper">
        <ion-img src="assets/foto-enzo.png" alt="Foto do aluno Enzo Fernandes de Oliveira"></ion-img>
      </div>

      <ion-card-header>
        <ion-badge color="secondary">AV3 - Consumo de API</ion-badge>
        <ion-card-title>{{ nome }}</ion-card-title>
        <ion-card-subtitle>{{ turma }} • {{ unidade }} • Turno {{ turno }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="none">
          <ion-item>
            <ion-icon name="person-circle-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h2>Aluno</h2>
              <p>{{ nome }}</p>
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="home-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h2>Turma, unidade e turno</h2>
              <p>{{ turma }} - Unidade {{ unidade }} - {{ turno }}</p>
            </ion-label>
          </ion-item>

          <ion-item>
            <ion-icon name="key-outline" slot="start" color="primary"></ion-icon>
            <ion-label>
              <h2>Palavra-chave</h2>
              <p>{{ palavraChave }}</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
