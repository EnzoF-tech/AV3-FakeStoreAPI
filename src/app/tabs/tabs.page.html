<div class="tabs-layout">
  <div class="tabs-content">
    <ion-router-outlet></ion-router-outlet>
  </div>

  <ion-tab-bar class="custom-tab-bar">
    <ion-tab-button type="button" (click)="navigate('/tabs/tab1')" [class.tab-selected]="isActive('/tabs/tab1')">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Início</ion-label>
    </ion-tab-button>

    <ion-tab-button type="button" (click)="navigate('/tabs/tab2')" [class.tab-selected]="isActive('/tabs/tab2')">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Um por um</ion-label>
    </ion-tab-button>

    <ion-tab-button type="button" (click)="navigate('/tabs/tab3')" [class.tab-selected]="isActive('/tabs/tab3')">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Todos</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</div>
